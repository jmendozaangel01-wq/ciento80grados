    <!--
      Chatwoot live chat. Deferred until the page is idle or the visitor
      interacts, so it no longer competes for bandwidth with the LCP paint.
      The init call itself is unchanged.
    -->
    <script>
      (function () {
        var loaded = false;

        function loadWidgets() {
          if (loaded) return;
          loaded = true;
          teardown();

          var BASE_URL = 'https://chat.ciento80grados.com';
          var chatwoot = document.createElement('script');
          chatwoot.src = BASE_URL + '/packs/js/sdk.js';
          chatwoot.async = true;
          chatwoot.onload = function () {
            window.chatwootSDK.run({
              websiteToken: '7p3v1kFy6NvqArwFiWP3x9e7',
              baseUrl: BASE_URL,
            });
          };
          document.body.appendChild(chatwoot);
        }

        var EVENTS = ['pointerdown', 'keydown', 'touchstart', 'scroll'];

        function teardown() {
          EVENTS.forEach(function (e) {
            window.removeEventListener(e, loadWidgets, { passive: true });
          });
        }

        EVENTS.forEach(function (e) {
          window.addEventListener(e, loadWidgets, { passive: true, once: true });
        });

        // Fallback: load on idle so the chat still appears without interaction.
        function scheduleIdleLoad() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadWidgets, { timeout: 4000 });
          } else {
            setTimeout(loadWidgets, 3000);
          }
        }

        if (document.readyState === 'complete') {
          scheduleIdleLoad();
        } else {
          window.addEventListener('load', scheduleIdleLoad, { once: true });
        }
      })();
    </script>
  </body>
